<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Clock</title>
  <link rel="stylesheet" href="/shared/card.css">
  <link rel="stylesheet" href="/shared/tile.css">
  <link rel="stylesheet" href="/clock/clock.css">
  <script type="module" src="/clock/clock.js"></script>
</head>
<body>
  <main class="card clock">
    <div class="clock__unit">
      <div data-tile="hours"></div>
      <span class="clock__date"></span>
    </div>
    <div class="clock__unit">
      <div data-tile="minutes"></div>
    </div>
    <div class="clock__unit">
      <div data-tile="seconds"></div>
    </div>
  </main>

  <template id="tile-template">
    <div class="tile">
      <div class="tile__half tile__half--top" data-part="top">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--bottom" data-part="bottom">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--top tile__flap tile__flap--top" data-part="flap-top">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--bottom tile__flap tile__flap--bottom" data-part="flap-bottom">
        <span class="tile__value"></span>
      </div>
    </div>
  </template>
</body>
</html>
