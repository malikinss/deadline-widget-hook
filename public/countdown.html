<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Deadline</title>
  <link rel="stylesheet" href="/card.css">
  <link rel="stylesheet" href="/countdown.css">
  <script type="module" src="/countdown.js"></script>
</head>
<body>
  <main class="card countdown">
        <div class="countdown__label"><span class="countdown__label-text">Deadline</span></div>

    <div class="countdown__tiles">
      <div class="countdown__unit">
        <div data-tile="days"></div>
        <div class="countdown__caption">Days</div>
      </div>
      <div class="countdown__unit">
        <div data-tile="hours"></div>
        <div class="countdown__caption">Hrs</div>
      </div>
      <div class="countdown__unit">
        <div data-tile="minutes"></div>
        <div class="countdown__caption">Mins</div>
      </div>
      <div class="countdown__unit">
        <div data-tile="seconds"></div>
        <div class="countdown__caption">Secs</div>
      </div>
    </div>
  </main>
    <template id="tile-template">
    <div class="tile">
      <div class="tile__half tile__half--top" data-part="top">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--bottom" data-part="bottom">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--top tile__flap tile__flap--top" data-part="flap-top">
        <span class="tile__value"></span>
      </div>
      <div class="tile__half tile__half--bottom tile__flap tile__flap--bottom" data-part="flap-bottom">
        <span class="tile__value"></span>
      </div>
    </div>
  </template>
</body>
</html>
